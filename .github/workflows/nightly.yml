name: Nightly Full Suite

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch: {}   # manual runs for testing the workflow itself

jobs:
  full-suite:
    name: Full Parallel Suite + Bash Golden Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # D1 (docs/reviews/improvement_program_2026-09-06.md §4): the differential
      # oracle is bash 5.3 (5.3.15 recorded) — the SAME binary the local gate
      # runs against, so version drift between hosts is impossible. Ubuntu's
      # system bash (5.2.21) is deliberately NO LONGER the oracle; it stays on
      # PATH only for the runner's own steps and the instrumentation below.
      # The prefix is cached by version+patch+platform+build-script hash; a
      # miss builds from the GNU tarball + patches 001..015 with every download
      # sha256-verified (tools/ci/build_bash_oracle.sh — runnable locally the
      # same way). restore/save are split (not actions/cache) because the
      # combined action saves only in its post step and only on a GREEN job;
      # this job has been red for weeks at a time, which would mean a rebuild
      # on every run. The save step sits AFTER the verify step and keeps the
      # default `success()` condition, so a prefix that fails verification is
      # never cached, while a red suite later in the job cannot prevent the
      # save.
      - name: Restore the bash 5.3.15 oracle from cache
        id: bash-oracle
        uses: actions/cache/restore@v4
        with:
          path: ~/bash-oracle-5.3.15
          key: bash-5.3.15-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/build_bash_oracle.sh') }}

      - name: Build the bash 5.3.15 oracle (cache miss only)
        if: steps.bash-oracle.outputs.cache-hit != 'true'
        run: sh tools/ci/build_bash_oracle.sh "$HOME/bash-oracle-5.3.15"

      # tests/harness/shell_oracle.py#resolve_bash honours BASH_PATH first.
      - name: Export BASH_PATH
        run: echo "BASH_PATH=$HOME/bash-oracle-5.3.15/bin/bash" >> "$GITHUB_ENV"

      # FAIL LOUDLY rather than silently test some other bash: a wrong binary
      # here would retune every differential row in this run to it.
      - name: Verify the oracle is bash 5.3.15
        run: |
          v=$("$BASH_PATH" -c 'echo "$BASH_VERSION"')
          case "$v" in
            5.3.15*) echo "oracle: $BASH_PATH $v" ;;
            *) echo "::error::BASH_PATH=$BASH_PATH reports BASH_VERSION '$v', expected 5.3.15* (D1 oracle pin)"; exit 1 ;;
          esac

      - name: Save the bash 5.3.15 oracle to cache (fresh, verified build only)
        if: steps.bash-oracle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/bash-oracle-5.3.15
          key: bash-5.3.15-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/build_bash_oracle.sh') }}

      # The two printf lines identify the oracle's `long double`, which is
      # what the platform-classified %a conformance rows are probed on
      # (tests/harness/oracle_policy.py, Park P-6): `printf '%a' 1` -> 0x8p-3
      # is the x87 explicit-integer-bit form (x86-64 glibc; skips the seven
      # x87-sensitive methods of test_printf_float_format_conformance.py);
      # `printf '%a' 0.1` with more than 13 fraction digits or a leading digit
      # other than 1 is a long double wider than double (x87 AND binary128,
      # e.g. aarch64 glibc; skips the two full-mantissa methods). IEEE double
      # prints 0x1p+0 and 0x1.999999999999ap-4 and skips nothing.
      - name: Show bash version
        run: |
          echo "--- system bash (runner PATH; NOT the oracle) ---"
          bash --version | head -1
          echo "--- oracle (BASH_PATH=$BASH_PATH) ---"
          "$BASH_PATH" --version | head -1
          echo "printf '%a' 1 on the oracle:"
          "$BASH_PATH" -c "printf '%a\n' 1"
          echo "printf '%a' 0.1 on the oracle:"
          "$BASH_PATH" -c "printf '%a\n' 0.1"
          echo "MACHTYPE (oracle) = $("$BASH_PATH" -c 'echo "$MACHTYPE"')"
          echo "MACHTYPE (runner shell) = $MACHTYPE"

      # EXPIRY — this whole instrumentation block (core_pattern normalisation,
      # the disk sampler, the open-fd snapshots, and PSH_DISK_WATCH on the suite
      # step) is RELAPSE WATCH for the escaped-writer bug fixed in slot 1.4, not
      # permanent workflow furniture. Removal criterion: once several
      # consecutive SCHEDULED nightlies are green with zero ENOSPC and no
      # sampler trip, delete it — the fix itself is pinned by
      # test_cap_kill_reaches_a_writer_that_left_the_process_group, so nothing
      # here is load-bearing for correctness. Removal is on the wave-close carry
      # list.
      #
      # Runner hygiene for a suite that kills processes with core-dumping
      # signals. The runner image routes core_pattern through a PIPE
      # (apport/systemd-coredump), and for piped dumps the kernel IGNORES
      # RLIMIT_CORE — so the suite's own soft-limit reset (tests/conftest.py)
      # cannot suppress a dump here, and a SIGQUIT'd psh subshell dumps a whole
      # ~20 MB CPython image. Pointing core_pattern at a plain file restores the
      # limit's authority, so nothing is written at all. Best-effort: the suite
      # asks the host what to expect (tests/harness/core_dump_env.py), so it is
      # correct either way. Disk is reported because run 30157713743 died with
      # ~26 ENOSPC on /tmp and the logs could not say what consumed it.
      - name: Normalise core dumping and report disk
        run: |
          echo "core_pattern (before): $(cat /proc/sys/kernel/core_pattern)"
          sudo sysctl -w kernel.core_pattern=core || echo "could not set core_pattern"
          echo "core_pattern (after):  $(cat /proc/sys/kernel/core_pattern)"
          echo "--- disk before suite ---"; df -h / /tmp; df -i / /tmp
          # Sample DURING the suite. Runs 30157713743 and 30158789660 hit
          # [Errno 28] on mkdir under /tmp while df reported 88G and 18.5M
          # inodes free both before and after — so the cause is neither bytes
          # nor inodes at rest, and a before/after pair cannot see it. Log the
          # peak and the /tmp entry count (an ext4 directory that has grown a
          # huge number of entries can itself return ENOSPC) so the next
          # occurrence is diagnosable instead of guessable.
          # Hard-bounded (timeout + setsid + detached fds): a `while :` sampler
          # left unbounded on a runner can outlive its step and confuse job
          # teardown, and a diagnostic must never be able to wedge the thing it
          # is diagnosing.
          # When free space falls below the trip point, snapshot the OPEN FILES
          # that are consuming it. Per-test attribution cannot find this writer:
          # under xdist a runaway in one worker is charged to whoever spans the
          # window, and the top "consumer" (25.5 GB) turned out to be a
          # long-running bystander that uses 22 MB when run alone. The file
          # itself is the ground truth — and because it is almost certainly
          # already UNLINKED (space returns when its fd closes, which is why
          # nothing is ever left on disk), /proc/PID/fd is the only place it can
          # still be seen.
          setsid timeout 3300 bash -c '
          tripped=0
          while :; do
            set -- $(df --output=avail,iavail / | tail -1)
            printf "%s avail_kb=%s ifree=%s tmp_entries=%s\n" \
              "$(date -u +%H:%M:%S)" "$1" "$2" "$(ls -U /tmp | wc -l)"
            if [ "$1" -lt 40000000 ] && [ "$tripped" -lt 3 ]; then
              tripped=$((tripped+1))
              echo "=== TRIP $tripped: avail_kb=$1 — largest open fds ==="
              for fd in /proc/[0-9]*/fd/*; do
                sz=$(stat -Lc %s "$fd" 2>/dev/null) || continue
                [ "${sz:-0}" -gt 104857600 ] || continue
                pid=$(echo "$fd" | cut -d/ -f3)
                printf "%12s bytes  pid=%s  target=%s\n  cmdline=%s\n" \
                  "$sz" "$pid" "$(readlink "$fd" 2>/dev/null)" \
                  "$(tr "\0" " " < /proc/$pid/cmdline 2>/dev/null | cut -c1-200)"
              done | sort -rn | head -20
              echo "=== end TRIP $tripped ==="
            fi
            sleep 5
          done' > /tmp/disk-samples.log 2>&1 < /dev/null &
          disown || true
          echo "sampler started (bounded at 3300s, open-fd snapshot below 40GB)"

      # --compare-bash adds the golden bash-comparison phase (Phase 2) to
      # the same run, so the full suite and the golden phase share one
      # invocation; --census logs the skip/xfail breakdown nightly.
      # --coverage accumulates one coverage db across all phases and writes
      # coverage.xml. Coverage is non-gating reporting (no --cov-fail-under);
      # it moved here from the per-PR gate (v0.330.0) to keep that gate fast.
      - name: Run Full Parallel Suite (with bash golden phase + coverage)
        # PSH_DISK_WATCH prints the tests that consumed the most free space.
        # The workflow sampler proved the nightly's [Errno 28] deaths are one
        # runaway writer draining ~400 MB/s with inodes flat, but it cannot say
        # WHICH test; this names it. See tests/conftest.py.
        env:
          PSH_DISK_WATCH: "1"
        run: python run_tests.py --parallel --compare-bash --census --coverage

      # Extended RD-vs-combinator parser differential. The full suite above
      # already runs this fuzzer at its fast default (150 snippets); here we
      # widen it enormously and rotate the seed per run so coverage of the
      # grammar accumulates over nightly runs. The seed is echoed (and embedded
      # in any failure message) so a divergence reproduces with a one-liner.
      - name: RD-vs-Combinator Parser Differential (extended fuzz)
        env:
          PSH_DIFFERENTIAL_SEED: ${{ github.run_number }}
          PSH_DIFFERENTIAL_ITERS: "40000"
        run: |
          echo "differential seed=$PSH_DIFFERENTIAL_SEED iters=$PSH_DIFFERENTIAL_ITERS"
          python -m pytest -p no:cacheprovider -o addopts="" \
            tests/parser_differential/test_combinator_random_differential.py

      # Benchmark tier (campaign E1b): `benchmark`-marked timing
      # microbenchmarks, serial, excluded from the standard gate. GATING
      # since Ceremony C (CR-R4 discharge, 2026-08-09): the three
      # dev-machine-tuned thresholds that failed on the shared runner were
      # retuned to runner-measured envelopes harvested from 3 consecutive
      # nightly artifacts (runs 31237400812/31145981907/31070163425;
      # evidence: docs/reviews/evidence/boundary_remediation_2026-07/
      # checkpoint-r/instruments/qr/p07_benchmark_baselines.transcript.txt),
      # ~2x the runner median, with behind-the-failure siblings scaled by
      # the tests' own pinned linear-scaling ratios. The transcript is
      # still uploaded as an artifact every run, so any future miss comes
      # with its measurement attached.
      - name: Benchmark Tier (serial; gating since CR-R4 retune)
        run: python run_tests.py --benchmarks --results-file tmp/benchmarks-nightly.txt

      - name: Report disk after suite
        if: always()
        run: |
          echo "--- disk after suite ---"; df -h / /tmp; df -i / /tmp
          echo "--- largest /tmp entries ---"
          sudo du -xm /tmp 2>/dev/null | sort -rn | head -20 || true
          echo "--- OPEN-FD SNAPSHOTS taken while space was draining ---"
          sed -n '/=== TRIP/,/=== end TRIP/p' /tmp/disk-samples.log 2>/dev/null \
            | head -80 || true
          echo "--- during-suite samples: 15 LOWEST free space ---"
          grep avail_kb= /tmp/disk-samples.log 2>/dev/null \
            | sort -t= -k2 -n | head -15 || true
          echo "--- during-suite samples: 5 most recent ---"
          tail -5 /tmp/disk-samples.log 2>/dev/null || true
          echo "--- sample count ---"; wc -l < /tmp/disk-samples.log 2>/dev/null || true
          # Cross-worker timeline. Per-test deltas alone cannot find the writer
          # under xdist (a runaway in one worker is charged to whatever short
          # test spans the window in another), so merge every worker's
          # line-per-test log in time order and show the window around the
          # lowest free-space reading. The test that spans the WHOLE drain is
          # the candidate; the ones that merely straddle it are not.
          echo "--- per-test timeline around the low-water mark ---"
          cat tmp/disk-watch-*.log 2>/dev/null | sort -n > /tmp/timeline.txt || true
          if [ -s /tmp/timeline.txt ]; then
            low=$(awk '{print $5}' /tmp/timeline.txt | sort -n | head -1)
            echo "lowest free bytes seen per-test: $low"
            awk -v low="$low" '$5 <= low * 1.10' /tmp/timeline.txt | head -40
            echo "--- 12 largest single-test drops (worker-tagged) ---"
            awk '{printf "%.0f MB  %s  %s\n", ($4-$5)/1048576, $3, $6}' \
              /tmp/timeline.txt | sort -rn | head -12
          else
            echo "(no per-test timeline; PSH_DISK_WATCH may be off)"
          fi

      - name: Upload Benchmark Transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-transcript
          path: tmp/benchmarks-nightly.txt
          if-no-files-found: warn

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

